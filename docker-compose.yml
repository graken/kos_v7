# version: 1.0.2
services:
  kos_app:
    build: .
    container_name: kos_app
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma
      - ./public/uploads:/app/public/uploads
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NODE_ENV=production
    restart: always
