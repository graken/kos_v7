name: Deploy to Synology NAS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT }}
          script: |
            cd /volume1/docker/kos_v7
            echo "📥 Updating code..."
            git stash
            git pull origin main
            echo "🐳 Force restarting Docker containers..."
            # 시놀로지 환경에서 sudo 경로 문제 해결을 위해 PATH 명시 및 명령어 위치 확인
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            DOCKER_CMD=$(which docker)
            
            if [ -z "$DOCKER_CMD" ]; then
              echo "❌ Error: docker command not found on NAS"
              exit 1
            fi

            echo "${{ secrets.NAS_PASSWORD }}" | sudo -S $DOCKER_CMD stop kos-v7 || true
            echo "${{ secrets.NAS_PASSWORD }}" | sudo -S $DOCKER_CMD rm kos-v7 || true
            
            # Docker Compose 실행 (v2 우선, v1 차선)
            if $DOCKER_CMD compose version > /dev/null 2>&1; then
              echo "${{ secrets.NAS_PASSWORD }}" | sudo -S $DOCKER_CMD compose up -d --build
            else
              echo "${{ secrets.NAS_PASSWORD }}" | sudo -S docker-compose up -d --build
            fi
            
            echo "🔐 Fixing database and file permissions..."
            echo "${{ secrets.NAS_PASSWORD }}" | sudo -S chmod -R 777 prisma public
            echo "✅ Deployment successful!"
