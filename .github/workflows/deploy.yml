name: Deploy to Synology NAS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          password: ${{ secrets.NAS_PASSWORD }}
          port: ${{ secrets.NAS_PORT }}
          script: |
            cd /volume1/docker/kos_v7
            echo "📥 Updating code..."
            git stash
            git pull origin main
            echo "🐳 Force restarting Docker containers..."
            # 기존에 수동으로 생성된 컨테이너가 있다면 강제 종료 및 삭제
            echo "${{ secrets.NAS_PASSWORD }}" | sudo -S docker stop kos-v7 || true
            echo "${{ secrets.NAS_PASSWORD }}" | sudo -S docker rm kos-v7 || true
            # 다시 빌드 및 실행
            if sudo docker compose version > /dev/null 2>&1; then
              echo "${{ secrets.NAS_PASSWORD }}" | sudo -S docker compose up -d --build
            else
              echo "${{ secrets.NAS_PASSWORD }}" | sudo -S docker-compose up -d --build
            fi
            echo "🔐 Fixing database and file permissions..."
            echo "${{ secrets.NAS_PASSWORD }}" | sudo -S chmod -R 777 prisma public/uploads src/store
            echo "✅ Deployment successful!"
